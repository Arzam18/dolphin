
name: arm64-musl-static

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build with native AOT in Alpine (musl)
        run: |
          set -eu

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:8.0-alpine \
            sh -c '
              set -eu

              apk add --no-cache clang lld build-base zlib-dev zlib-static

              sed -i "s#<TargetFramework>net5.0</TargetFramework>#<TargetFramework>net8.0</TargetFramework>#" Dolphin2.csproj

              dotnet publish Dolphin2.csproj \
                -c Release \
                -r linux-musl-arm64 \
                -p:PublishAot=true \
                -p:PlatformTarget=AnyCPU \
                -p:StaticExecutable=true \
                -p:InvariantGlobalization=true \
                -o out

              ./out/Dolphin2 bench
              ./out/Dolphin2 perft 5
            '

      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-linux-musl-arm64
          path: out/Dolphin2
          if-no-files-found: error
